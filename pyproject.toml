[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyuan-bench"
version = "0.1.0"
description = "Lightweight, capability-aware runner for Zhiyuan agent evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
zhiyuan-bench = "zhiyuan_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

